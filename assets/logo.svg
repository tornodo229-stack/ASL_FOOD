<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="goldFireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark circular background with subtle texture -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="rgba(249, 115, 22, 0.3)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Top Decorative Stars -->
  <g fill="#facc15" filter="url(#glow)">
    <!-- Center star -->
    <polygon points="250,70 254,82 267,82 256,90 260,102 250,94 240,102 244,90 233,82 246,82" transform="scale(0.8) translate(62, 20)" />
    <!-- Left star -->
    <polygon points="250,70 254,82 267,82 256,90 260,102 250,94 240,102 244,90 233,82 246,82" transform="scale(0.55) translate(145, 68)" opacity="0.85" />
    <!-- Right star -->
    <polygon points="250,70 254,82 267,82 256,90 260,102 250,94 240,102 244,90 233,82 246,82" transform="scale(0.55) translate(308, 68)" opacity="0.85" />
  </g>

  <!-- Central Emblem: Crown & Flame & Chef Motif -->
  <g transform="translate(250, 155)">
    <!-- Flame background aura -->
    <path d="M0 -55 C22 -30, 42 -5, 36 25 C30 50, 14 62, 0 65 C-14 62, -30 50, -36 25 C-42 -5, -22 -30, 0 -55 Z" 
          fill="url(#goldFireGrad)" opacity="0.95" filter="url(#glow)" />
    <!-- Inner Flame core -->
    <path d="M0 -30 C12 -15, 22 5, 18 25 C14 38, 6 46, 0 48 C-6 46, -14 38, -18 25 C-22 5, -12 -15, 0 -30 Z" 
          fill="#fef08a" />
    <!-- Chef Hat / Crown lines -->
    <path d="M -24 35 L 24 35 L 20 45 L -20 45 Z" fill="#ffffff" />
  </g>

  <!-- ASL FOOD Main Text -->
  <text x="250" y="278" 
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-size="64" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="5"
        fill="#ffffff">
    ASL FOOD
  </text>

  <!-- Decorative Separator Ribbon -->
  <path d="M 120 295 L 210 295 M 290 295 L 380 295" stroke="url(#goldFireGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="250" cy="295" r="5" fill="#facc15" filter="url(#glow)" />

  <!-- OILAVIY KAFE Subtitle -->
  <text x="250" y="332" 
        font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
        font-size="20" 
        font-weight="800" 
        text-anchor="middle" 
        letter-spacing="7"
        fill="url(#goldFireGrad)">
    OILAVIY KAFE
  </text>

  <!-- Location / Fast Delivery Ribbon Tag -->
  <g transform="translate(250, 385)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="rgba(249, 115, 22, 0.15)" stroke="rgba(249, 115, 22, 0.5)" stroke-width="1.5" />
    <text x="0" y="6" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="13" 
          font-weight="700" 
          text-anchor="middle" 
          letter-spacing="2"
          fill="#fed7aa">
      NAVBAXOR • FURQAT
    </text>
  </g>

  <!-- Curved Bottom Accent -->
  <path d="M 170 425 Q 250 445 330 425" stroke="rgba(249, 115, 22, 0.3)" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
